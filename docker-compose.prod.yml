# ============================================
# Pet Daylight - Production Docker Compose
# ============================================
# 로컬 테스트용 / EC2 단일 서버 배포용

version: '3.8'

services:
  # ===========================================
  # Django Backend
  # ===========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petdaylight-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8001:8000"
    depends_on:
      - redis
    networks:
      - petdaylight-network
  # ===========================================
  # Frontend
  # ===========================================
  frontend:
    build: ./frontend
    container_name: petdaylight-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - petdaylight-network
  # ===========================================
  # Redis (캐시 & 세션)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: petdaylight-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - petdaylight-network

  # ===========================================
  # Nginx (리버스 프록시)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: petdaylight-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - petdaylight-network

networks:
  petdaylight-network:
    driver: bridge

volumes:
  redis_data:
