# ===========================
# Pet Daylight Alertmanager Configuration
# ===========================

global:
  resolve_timeout: 5m

# 알림 라우팅 설정
route:
  receiver: 'discord'
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Severity별 라우팅
  routes:
    - receiver: 'discord-critical'
      match:
        severity: critical
      repeat_interval: 1h

    - receiver: 'discord'
      match:
        severity: warning
      repeat_interval: 4h

# Inhibition rules (중복 알림 억제)
inhibit_rules:
  # ServiceDown이 발생하면 해당 서비스의 다른 알림 무시
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']

# 알림 수신자 설정
receivers:
  # Discord (일반 알림)
  - name: 'discord'
    webhook_configs:
      - url: 'http://discord-relay:8800/grafana'
        send_resolved: true

  # Discord (긴급 알림)
  - name: 'discord-critical'
    webhook_configs:
      - url: 'http://discord-relay:8800/grafana'
        send_resolved: true

