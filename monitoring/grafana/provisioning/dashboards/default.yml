# ===========================
# Grafana Dashboard Provisioning
# ===========================

apiVersion: 1

providers:
  - name: 'Pet Daylight Dashboards'
    orgId: 1
    folder: 'Pet Daylight'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
