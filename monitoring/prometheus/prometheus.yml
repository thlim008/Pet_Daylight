# ===========================
# Pet Daylight Prometheus Configuration
# ===========================

global:
  scrape_interval: 15s  # 기본 수집 주기
  evaluation_interval: 15s  # 알람 규칙 평가 주기
  external_labels:
    cluster: 'petdaylight-prod'
    environment: 'production'

# 알람 규칙 파일
rule_files:
  - "/etc/prometheus/rules.yml"

# Alertmanager 연결
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# 메트릭 수집 대상
scrape_configs:
  
  # ---------------------------
  # Django 백엔드 메트릭
  # ---------------------------
  - job_name: "django"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'petdaylight-backend'

  # ---------------------------
  # Node Exporter (시스템 리소스)
  # ---------------------------
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ec2-instance'

  # ---------------------------
  # Redis Exporter
  # ---------------------------
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'petdaylight-redis'

  # ---------------------------
  # PostgreSQL/RDS Exporter
  # ---------------------------
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'petdaylight-rds'

  # ---------------------------
  # cAdvisor (컨테이너 메트릭)
  # ---------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-containers'

  # ---------------------------
  # Prometheus 자신
  # ---------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'prometheus-server'
